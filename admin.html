<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔐 Admin · blog</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script>
  <script src="admin.js"></script>villain arc 
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="flex-row" style="margin-bottom: 1rem;">
    <h1>🔐 admin <span class="admin-badge" style="background:#1e293b;color:white;font-size:0.75rem;padding:0.2rem 0.8rem;border-radius:30px;">dashboard</span></h1>
    <div id="authStatus">⏳ checking ...</div>
  </div>

  <div id="loginCard" class="card">
    <h2>👋 login to manage posts</h2>
    <div style="margin-top: 1rem;">
      <input type="email" id="loginEmail" placeholder="admin email" style="margin-bottom: 0.8rem;" />
      <input type="password" id="loginPassword" placeholder="password" style="margin-bottom: 0.8rem;" />
      <button id="loginBtn">🔑 login</button>
      <div id="loginError" style="color:#b91c1c; margin-top: 0.5rem;"></div>
    </div>
  </div>

  <div id="adminPanel" class="card hidden">
    <div class="flex-row">
      <h2>✏️ publish new post</h2>
      <button id="logoutBtn" class="btn-outline" style="padding: 0.4rem 1.2rem;">🚪 logout</button>
    </div>
    <div class="admin-area">
      <div class="form-group">
        <label style="font-weight: 500; display: block; margin-bottom: 0.3rem;">📌 title</label>
        <input type="text" id="postTitle" placeholder="blog title" />
      </div>
      <div class="form-group">
        <label style="font-weight: 500; display: block; margin-bottom: 0.3rem;">✍️ content</label>
        <textarea id="postContent" placeholder="write your blog content ..."></textarea>
      </div>
      <button id="publishBtn">🚀 publish post</button>
      <div id="publishStatus" style="margin-top: 0.6rem; font-size: 0.9rem;"></div>
    </div>
    <div style="margin-top: 0.8rem;">
      <button id="deleteAllBtn" class="btn-outline" style="color: #b91c1c; border-color: #fecaca;">🗑️ delete all posts</button>
    </div>
    <a href="index.html" class="back-link">← back to public blog</a>
  </div>

</body>
</html>
