<!DOCTYPE html>                                      <!-- Tells the browser to use modern HTML5 rules. -->
<html lang="en">                                    <!-- Starts the page and declares English as its language. -->
<head>                                               <!-- Contains settings and resources that are not page content. -->
  <meta charset="UTF-8" />                          <!-- Allows the page to display text and emoji correctly. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- Makes the layout adapt to phones. -->
  <title>📘 Blog · index</title>                    <!-- Sets the text shown in the browser tab. -->
  <!-- Firebase SDKs -->                              <!-- Loads the Firebase libraries used by this page. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app-compat.js"></script> <!-- Loads Firebase core. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-firestore-compat.js"></script> <!-- Loads the database API. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth-compat.js"></script> <!-- Loads the sign-in API. -->
  <link rel="stylesheet" href="style.css" class="css">
 
</head>                                                <!-- Ends the page settings section. -->
<body>                                                 <!-- Starts the visible page content. -->

  <div class="flex-row" style="margin-bottom: 1rem;"> <!-- Holds the title and authentication status. -->
    <h1>📘 blog <span class="admin-badge">public</span></h1> <!-- Shows the public blog title and badge. -->
    <div id="authStatus">🔒 not logged in</div>       <!-- Displays the current Firebase sign-in state. -->
  </div>                                                <!-- Ends the page header. -->

  <!-- PUBLIC BLOG LIST -->                         <!-- Labels the main public content area. -->
  <div class="card">                                <!-- Creates the white post panel. -->
    <h2>📰 all posts</h2>                             <!-- Names the post list. -->
    <div id="blogList" class="blog-list">         <!-- Receives post markup generated by JavaScript. -->
      <p style="color: #64748b;">loading posts ...</p> <!-- Appears while Firestore is loading. -->
    </div>                                           <!-- Ends the dynamic post container. -->
  </div>                                             <!-- Ends the post panel. -->

  <!-- quick admin link -->                         <!-- Labels the link to the private dashboard. -->
  <div style="text-align: right; margin-top: -0.5rem;"> <!-- Aligns the admin link to the right. -->
    <a href="admin.html" style="color: #3b82f6; text-decoration: none; font-weight: 500;">⚙️ go to admin panel →</a> <!-- Opens admin.html. -->
  </div>                                           <!-- Ends the admin-link area. -->

  <hr />                                             <!-- Visually separates the two page sections. -->
  <h2>📖 README – setup guide</h2>                  <!-- Labels the setup instructions. -->
  <div id="readmeSection"></div>                   <!-- Receives the README text from JavaScript. -->

  <script>                                           <!-- Starts the page's JavaScript logic. -->
    // ========== FIREBASE CONFIG (REPLACE WITH YOUR OWN) ========== // Marks the configuration section.
// ========== FIREBASE CONFIG (REPLACE WITH YOUR OWN) ==========     // Repeats the section marker from the original file.
const firebaseConfig = {                                // Stores the Firebase project settings.
  apiKey: "AIzaSyCwAA6exYSVleLqhdBnfSuxJ5aq373ywRk",   // Identifies this browser application publicly.
  authDomain: "my-blog-58113.firebaseapp.com",          // Provides the Firebase authentication domain.
  projectId: "my-blog-58113",                           // Selects the Firestore project.
  storageBucket: "my-blog-58113.firebasestorage.app",  // Identifies the project's storage bucket.
  messagingSenderId: "1052463297922",                  // Identifies the Firebase messaging sender.
  appId: "1:1052463297922:web:d56643a36da7c092708b9b"  // Identifies this registered web app.
};                                                       // Finishes the Firebase settings object.

    firebase.initializeApp(firebaseConfig);              // Connects this page to the Firebase project.
    const db = firebase.firestore();                     // Creates a handle for reading the posts collection.
    const auth = firebase.auth();                        // Creates a handle for observing sign-in state.

    const blogListEl = document.getElementById('blogList');       // Finds the element where posts will be rendered.
    const authStatus = document.getElementById('authStatus');    // Finds the element that shows sign-in status.
    const readmeSection = document.getElementById('readmeSection'); // Finds the element for the setup guide.

    // ========== README CONTENT ==========                 // Marks the embedded setup-guide section.
    const readmeText = `# 📘 Basic Blog + Admin (Firebase)

## 🚀 Deploy on GitHub Pages
1. Create a new public repo on GitHub.
2. Upload ALL files: index.html, admin.html, firebase-config.js, README.md.
3. Go to Settings > Pages, select "main" branch, save.
4. Your site will be live at: https://YOUR-USERNAME.github.io/REPO-NAME

## 🔥 Firebase setup (no prior knowledge needed)
1. Go to https://console.firebase.google.com/
2. Click "Add project" → name it → disable Google Analytics.
3. In the left menu, click "Firestore Database" → "Create database" → start in test mode (yes, allow all).
4. In the left menu, click "Authentication" → "Get started" → "Email/Password" → enable it.
5. In the left menu, click "Project settings" (gear icon) → "Your apps" → add a web app (</> icon).
6. Register app (nickname: "blog") → copy the firebaseConfig object.
7. PASTE that config into the firebaseConfig variable in:
   - index.html (around line 70)
   - admin.html (around line 70)
   - firebase-config.js (optional, but used in both pages)
8. Go to Firestore Database → "Rules" tab → set rules to:
   rules_version = '2';
   service cloud.firestore {
     match /databases/{database}/documents {
       match /{document=**} {
         allow read, write: if true;
       }
     }
   }
   (this allows full access for demo; you can restrict later)

## 🔐 Create admin user
1. In Firebase Console → Authentication → "Add user" (email/password).
2. Use this email & password to login on the admin page.

## ✨ How to use
- Open index.html → public blog feed.
- Go to admin.html → login with admin credentials.
- Publish new posts, delete all posts.
- All changes appear instantly on index.html.

## 📁 Files
- index.html       → public blog view
- admin.html       → admin dashboard (login required)
- firebase-config.js → shared config (optional, but recommended)
- README.md        → this file

Made with ❤️ + Firebase.`;

    // ========== RENDER BLOGS ==========                    // Marks the function that turns database data into HTML.
    function renderBlogs(snapshot) {                        // Receives one Firestore result snapshot.
      const docs = snapshot.docs;                            // Extracts the individual post documents.
      if (docs.length === 0) {                               // Checks whether the database returned no posts.
        blogListEl.innerHTML = `<p style="color: #64748b;">✨ no posts yet. be the first!</p>`; // Shows the empty state.
        return;                                              // Stops because there is nothing else to render.
      }                                                       // Ends the empty-result check.
      let html = '';                                          // Starts an empty string for the generated markup.
      docs.forEach(doc => {                                   // Processes every post document in order.
        const data = doc.data();                              // Converts a Firestore document into a normal object.
        const date = data.createdAt?.toDate?.()?.toLocaleString() || 'just now'; // Formats its timestamp safely.
        // The template below creates one visible post card.  // This explains the following multiline string.
        html += `
          <div class="blog-item">
            <h3>${escapeHtml(data.title) || 'untitled'}</h3>
            <div class="meta">📅 ${date}</div>
            <p>${escapeHtml(data.content) || ''}</p>
          </div>
        `;
      });                                                    // Finishes processing all returned documents.
      blogListEl.innerHTML = html;                           // Replaces the loading content with the post list.
    }                                                         // Ends the post-rendering function.

    function escapeHtml(text) {                              // Converts user text into safe HTML text.
      if (!text) return '';                                   // Returns empty text for missing values.
      const div = document.createElement('div');              // Creates a temporary browser element.
      div.textContent = text;                                 // Lets the browser escape HTML characters safely.
      return div.innerHTML;                                   // Reads the escaped result back as a string.
    }                                                         // Ends the HTML-escaping helper.

    // ========== LISTEN TO POSTS (REALTIME) ==========       // Marks the realtime database listener section.
    let unsubscribePosts = null;                             // Stores the function that can stop the current listener.

    function subscribePosts() {                              // Starts listening for changes in the posts collection.
      if (unsubscribePosts) unsubscribePosts();               // Stops an older listener before creating a new one.
      unsubscribePosts = db.collection('posts')             // Selects the Firestore collection named posts.
        .orderBy('createdAt', 'desc')                         // Sorts newest posts before older posts.
        .onSnapshot(snapshot => {                             // Runs whenever Firestore sends fresh data.
          renderBlogs(snapshot);                              // Renders the latest snapshot into the page.
        }, error => {                                         // Defines what happens when the listener fails.
          console.error('Firestore error:', error);           // Logs technical error details for debugging.
          blogListEl.innerHTML = `<p style="color: #b91c1c;">⚠️ error loading posts: ${error.message}</p>`; // Shows a user-facing error.
        });                                                   // Finishes the realtime listener registration.
    }                                                         // Ends the subscription function.

    // ========== AUTH STATE (show login status) ==========    // Marks the public auth-status section.
    auth.onAuthStateChanged(user => {                         // Runs whenever the Firebase user changes.
      if (user) {                                              // Checks whether a user is signed in.
        authStatus.textContent = `✅ logged in as ${user.email}`; // Displays the signed-in email as plain text.
      } else {                                                 // Handles the signed-out state.
        authStatus.innerHTML = `🔒 not logged in · <a href="admin.html" style="color:#3b82f6;text-decoration:none;">login</a>`; // Offers a login link.
      }                                                      // Ends the signed-in check.
    });                                                       // Registers the auth-state listener.

    // ========== LOAD README ==========                       // Marks the setup-guide loading section.
    readmeSection.textContent = readmeText;                   // Displays the template string without interpreting it as HTML.

    // ========== START ==========                             // Marks the startup section.
    subscribePosts();                                         // Begins loading and watching blog posts.
    console.log('📘 index.html ready.');                      // Confirms initialization in browser developer tools.
  </script>                                                   <!-- Ends the page JavaScript. -->
</body>                                                        <!-- Ends the visible page content. -->
</html>                                                       <!-- Ends the HTML document. -->
